name: Auto Version Bump

on:
  push:
    branches:
      - main

jobs:
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necessário para commit e push

    steps:
      # 1. Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para acessar histórico de commits
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Configurar Git
      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      # 3. Ler versão atual
      - name: Read current version
        id: current_version
        run: |
          VERSION=$(grep -oP '__version__ = "\K[^"]+' app/version.py)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      # 4. Determinar tipo de bump baseado na mensagem do commit
      - name: Determine version bump type
        id: bump_type
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Commit message: $COMMIT_MSG"
          
          # Verificar se é um commit de versão (skip)
          if [[ "$COMMIT_MSG" == *"[skip ci]"* ]] || [[ "$COMMIT_MSG" == *"chore: bump version"* ]]; then
            echo "type=skip" >> $GITHUB_OUTPUT
            echo "Skipping version bump (automated commit)"
            exit 0
          fi
          
          # Verificar se começa com 'feat:' ou 'feat(' para minor bump
          if [[ "$COMMIT_MSG" =~ ^feat(\(|:) ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
            echo "Feature commit detected - MINOR bump"
          else
            echo "type=patch" >> $GITHUB_OUTPUT
            echo "Regular commit - PATCH bump"
          fi

      # 5. Calcular nova versão
      - name: Calculate new version
        if: steps.bump_type.outputs.type != 'skip'
        id: new_version
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          BUMP_TYPE="${{ steps.bump_type.outputs.type }}"
          
          # Separar major.minor.patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          
          if [ "$BUMP_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      # 6. Atualizar arquivo version.py
      - name: Update version.py
        if: steps.bump_type.outputs.type != 'skip'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          echo '__version__ = "'$NEW_VERSION'"' > app/version.py
          cat app/version.py

      # 7. Commit e push da nova versão
      - name: Commit and push version bump
        if: steps.bump_type.outputs.type != 'skip'
        run: |
          git add app/version.py
          git commit -m "chore: bump version to ${{ steps.new_version.outputs.version }} [skip ci]"
          git push

      # 8. Criar tag Git (opcional, mas recomendado)
      - name: Create Git tag
        if: steps.bump_type.outputs.type != 'skip'
        run: |
          git tag "v${{ steps.new_version.outputs.version }}"
          git push origin "v${{ steps.new_version.outputs.version }}"
